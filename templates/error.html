<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-EXEWN0JKT1"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){ window.dataLayer.push(arguments); }
      gtag('js', new Date());
      gtag('config', 'G-EXEWN0JKT1');
    </script>
    <title>{{ error_title }} - MangaNoka</title>
    <meta name="robots" content="noindex">
    <link rel="stylesheet" href="{{ url_for('static', path='/style.css') }}?v=1.2">
    <link rel="icon" href="{{ url_for('static', path='/noka_logo.svg') }}" type="image/svg+xml">
    <link rel="icon" href="/favicon.ico" sizes="48x48" type="image/x-icon">
    <link rel="icon" href="/favicon-32x32.png" sizes="32x32" type="image/png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="manifest" href="{{ url_for('static', path='/manifest.json') }}">
    <script src="{{ url_for('static', path='/theme.js') }}"></script>
    <style>
        .error-page {
            min-height: 70vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 48px 24px;
            gap: 8px;
        }
        .error-page img.noka {
            width: 180px;
            height: auto;
            margin-bottom: 24px;
            animation: noka-float 3s ease-in-out infinite;
        }
        @keyframes noka-float {
            0%, 100% { transform: translateY(0) rotate(-2deg); }
            50%      { transform: translateY(-10px) rotate(2deg); }
        }
        @media (prefers-reduced-motion: reduce) {
            .error-page img.noka { animation: none; }
        }
        .error-page .code {
            font-family: 'Space Grotesk', 'Outfit', sans-serif;
            font-size: 64px;
            font-weight: 700;
            color: var(--brand);
            line-height: 1;
            margin: 0;
        }
        .error-page h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 24px;
            margin: 8px 0 4px;
            color: var(--ink);
        }
        .error-page .brush {
            width: 180px;
            height: 10px;
            margin: 4px auto 12px;
        }
        .error-page p {
            color: var(--muted);
            max-width: 440px;
            margin: 0 0 24px;
        }
        .error-page .btn-home {
            display: inline-block;
            background: var(--brand);
            color: #fff;
            text-decoration: none;
            font-weight: 600;
            padding: 12px 28px;
            border-radius: var(--radius-md);
            transition: background 150ms ease, transform 150ms ease;
        }
        .error-page .btn-home:hover {
            background: var(--brand-dark);
            transform: translateY(-1px);
        }
    </style>
    <script defer src="https://cloud.umami.is/script.js" data-website-id="83ab3ed5-3da3-4d7f-bb38-1c19953d0c57"></script>
</head>
<body>
    <header class="site-top">
        <div class="topbar">
            <a class="brand" href="/fr">
                <img class="brand-logo" src="{{ url_for('static', path='/noka_logo.svg') }}" alt="MangaNoka logo">
                <span>Manga<b>Noka</b></span>
            </a>
        </div>
    </header>

    <main class="shell">
        <div class="error-page">
            <img class="noka" src="{{ url_for('static', path=noka_image) }}" alt="Noka {{ error_title }}">
            <p class="code">{{ status_code }}</p>
            <h1>{{ error_title }}</h1>
            <img class="brush" src="{{ url_for('static', path='/brushstroke.svg') }}" alt="">
            <p>{{ error_message }}</p>
            <div style="display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; margin-bottom: 24px;">
                <a class="btn-home" href="/fr">🏮 Retour à l'accueil</a>
                <a class="btn-home" href="/?list=1" style="background: var(--surface); color: var(--ink); border: 1px solid var(--line);">📚 Dernières sorties</a>
                <a class="btn-home" href="/search" style="background: var(--surface); color: var(--ink); border: 1px solid var(--line);">🔍 Rechercher un manga</a>
            </div>
            <div style="margin-top: 16px; font-size: 13px; color: var(--muted);">
                <span>Recherches populaires : </span>
                <a href="/search?q=action" style="color: var(--brand); font-weight: bold; text-decoration: none; margin: 0 4px;">Action</a> ·
                <a href="/search?q=dragon" style="color: var(--brand); font-weight: bold; text-decoration: none; margin: 0 4px;">Dragon</a> ·
                <a href="/search?q=hero" style="color: var(--brand); font-weight: bold; text-decoration: none; margin: 0 4px;">Hero</a> ·
                <a href="/search?q=romance" style="color: var(--brand); font-weight: bold; text-decoration: none; margin: 0 4px;">Romance</a>
            </div>
        </div>
    </main>

</html>
